<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sitio en mantenimiento</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8faf9;
      font-family: Arial, Helvetica, sans-serif;
      color: #263238;
      text-align: center;
      padding: 25px;
    }

    .container {
      max-width: 600px;
    }

    .icon {
      font-size: 60px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 15px;
      color: #0f766e;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #64748b;
    }

    .line {
      width: 70px;
      height: 4px;
      background: #14b8a6;
      margin: 25px auto;
      border-radius: 10px;
    }

    .small {
      margin-top: 25px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">⚙️</div>

    <h1>Sitio web en mantenimiento</h1>

    <div class="line"></div>

    <p>
      Estamos realizando actualizaciones y mejoras en nuestro sitio web.
      <br><br>
      Estaremos disponibles nuevamente muy pronto.
    </p>

    <p class="small">
      Gracias por su comprensión.
    </p>

  </div>

</body>
</html>
